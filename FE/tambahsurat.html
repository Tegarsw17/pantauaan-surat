<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Surat Menyurat</title>

    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="plugins/fontawesome-free/css/all.min.css">
    <!-- IonIcons -->
    <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
    <!-- Theme style -->
    <link rel="stylesheet" href="dist/css/adminlte.min.css">
</head>

<body class="hold-transition sidebar-mini">
    <div class="wrapper">
        <!-- Navbar -->
        <nav class="main-header navbar navbar-expand navbar-white navbar-light">
            <!-- Left navbar links -->
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
                </li>
            </ul>

            <!-- Right navbar links -->
            <ul class="navbar-nav ml-auto">
                <!-- Notifications Dropdown Menu -->
                <li class="nav-item dropdown">
                    <a class="nav-link" data-toggle="dropdown" href="#">
                        <div class="user-panel  d-flex">
                            <div class="info">
                                <span href="#" class="d-block" id="namaUser"></span>
                            </div>
                            <div class="image">
                                <img src="dist/img/user2-160x160.jpg" class="img-circle elevation-2" alt="User Image">
                            </div>
                        </div>
                    </a>
                    <div class="dropdown-menu dropdown-menu-lg dropdown-menu-right">
                        <a href="#" onclick="logout()" class="dropdown-item">
                            <p>Logout</p>
                        </a>
                    </div>
                </li>
            </ul>
        </nav>
        <!-- /.navbar -->

        <!-- Main Sidebar Container -->
        <aside class="main-sidebar sidebar-dark-primary elevation-4">
            <!-- Brand Logo -->
            <a href="index.html" class="brand-link text-center">
                <span class="brand-text ">SURAT</span>
            </a>

            <!-- Sidebar -->
            <div class="sidebar">
                <!-- Sidebar Menu -->
                <nav class="mt-2" id="navbar"></nav>
                <!-- /.sidebar-menu -->
            </div>
            <!-- /.sidebar -->
        </aside>

        <!-- Content Wrapper. Contains page content -->
        <div class="content-wrapper">
            <!-- Content Header (Page header) -->
            <div class="content-header">
                <div class="d-flex justify-content-between ml-2 mr-2">
                    <h1 class="m-0">Registrasi</h1>
                </div>
            </div>
            <!-- /.content-header -->

            <!-- Main content -->
            <div class="content">
                <div class="row">
                    <div class="col-8">
                        <div class="container-fluid">
                            <div class="card card-primary">
                                <form id="suratForm">
                                    <div class="card-body">
                                        <div class="form-group">
                                            <label for="jenis_surat">Jenis Surat</label>
                                            <select class="form-control" id="jenis_surat" onchange="viewTujuan()">
                                                <option value="surat masuk">Surat Masuk</option>
                                                <option value="surat keluar">Surat Keluar</option>
                                            </select>
                                        </div>
                                        <div class="form-group" id="tujuanView" hidden>
                                            <label for="tujuan">Tujuan</label>
                                            <input type="text" class="form-control" name="tujuan" id="tujuan">
                                        </div>
                                        <div class="form-group">
                                            <label for="no_surat">Nomor Surat</label>
                                            <input type="text" class="form-control" name="no_surat" id="no_surat" required>
                                        </div>
                                        <div class="form-row">
                                            <div class="form-group col-md-6">
                                                <label for="pengirim">Pengirim</label>
                                                <input type="text" class="form-control" name="pengirim" id="pengirim" required>
                                            </div>
                                            <div class="form-group col-md-6">
                                                <label for="perihal">Perihal</label>
                                                <input type="text" class="form-control" name="perihal" id="perihal" required>
                                            </div>
                                        </div>
                                        <div class="form-row">
                                            <div class="form-group col-md-6">
                                                <label for="tanggal_surat">Tanggal Surat</label>
                                                <input type="date" class="form-control" name="tanggal_surat" id="tanggal_surat" required>
                                            </div>
                                            <div class="form-group col-md-6">
                                                <label for="tanggal_terima">Tanggal Diterima</label>
                                                <input type="date" class="form-control" name="tanggal_terima" id="tanggal_terima" required>
                                            </div>
                                        </div>
                                        <div class="form-row">
                                            <div class="form-group col-md-6">
                                                <label for="status">Status</label>
                                                <input type="text" class="form-control" name="status" id="status" required>
                                            </div>
                                            <div class="form-group col-md-6">
                                                <label for="control">Control</label>
                                                <input type="text" class="form-control" name="control" id="control">
                                            </div>
                                        </div>
                                        <div class="form-row">
                                            <div class="form-group col-md-6">
                                                <label for="unit_proses">Unit Proses</label>
                                                <input type="text" class="form-control" name="unit_proses" id="unit_proses">
                                            </div>
                                            <div class="form-group col-md-6">
                                                <label for="tindak_lanjut">Tindak Lanjut</label>
                                                <input type="text" class="form-control" name="tindak_lanjut" id="tindak_lanjut">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label for="keterangan">Keterangan</label>
                                            <textarea class="form-control" id="keterangan" rows="3"></textarea>
                                        </div>
                                        <div class="form-group">
                                            <div class="custom-file">
                                                <input type="file" class="custom-file-input" id="file" accept="application/pdf" required onchange="updateFileName()">
                                                <label class="custom-file-label" for="file">Choose file</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card-footer">
                                        <button type="submit" class="btn btn-primary">Submit</button>
                                    </div>
                                </form>
                            </div>
                            <!-- content position -->
                        </div>
                    </div>
                </div>
                <!-- /.container-fluid -->
            </div>
            <!-- /.content -->
        </div>
        <!-- /.content-wrapper -->

        <!-- Control Sidebar -->
        <aside class="control-sidebar control-sidebar-dark">
            <!-- Control sidebar content goes here -->
        </aside>
        <!-- /.control-sidebar -->

        <!-- Main Footer -->
        <footer class="main-footer">
            <strong>Copyright &copy; 2023.</strong>
        </footer>
    </div>
    <!-- ./wrapper -->

    <!-- REQUIRED SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- jQuery -->
    <script src="plugins/jquery/jquery.min.js"></script>
    <!-- Bootstrap -->
    <script src="plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- AdminLTE -->
    <script src="dist/js/adminlte.js"></script>
    <script src="dist/js/navbar.js"></script>
    <script src="dist/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        var role = localStorage.getItem("role_id");
        $(document).ready(function () {
            $("#namaUser").html(username);
            roleCanAccess([1], role);
        });

        function viewTujuan() {
            var jns_surat = document.getElementById("jenis_surat").value;
            $('#tujuanView').toggle(jns_surat === 'surat keluar');
        }

        const form = document.getElementById("suratForm");
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const inputData = {
                jenis_surat: document.getElementById("jenis_surat").value,
                tujuan: document.getElementById("tujuan").value,
                nomor_surat: document.getElementById("no_surat").value,
                pengirim: document.getElementById("pengirim").value,
                perihal: document.getElementById("perihal").value,
                tanggal_surat: document.getElementById("tanggal_surat").value,
                tanggal_diterima: document.getElementById("tanggal_terima").value,
                status: document.getElementById("status").value,
                control: document.getElementById("control").value,
                unit_proses: document.getElementById("unit_proses").value,
                tindak_lanjut: document.getElementById("tindak_lanjut").value,
                keterangan: document.getElementById("keterangan").value,
            };

            // Validasi input
            if (!inputData.nomor_surat || !inputData.pengirim) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Validation Error',
                    text: 'Nomor Surat dan Pengirim harus diisi.'
                });
                return;
            }

            try {
                const token = localStorage.getItem('token');
                const res = await axios.post(`${linkApi}/surat`, inputData, {
                    headers: { 'authorization': token }
                });
                if (res.status === 200) {
                    await sendImage(res.data.data.surat_id);
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: err.response?.data?.message || 'Terjadi kesalahan, coba lagi.'
                });
            }
        });

        const sendImage = async (id) => {
            const fileInput = document.getElementById("file");
            const file = fileInput.files[0];

            if (!file) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Validation Error',
                    text: 'File harus dipilih.'
                });
                return;
            }

            try {
                const token = localStorage.getItem('token');
                const formData = new FormData();
                formData.append("file", file);

                const response = await axios.post(`${linkApi}/upload/${id}`, formData, {
                    headers: {
                        'authorization': token,
                        'Content-Type': 'multipart/form-data'
                    }
                });

                if (response.status === 200) {
                    Swal.fire({
                        title: "Success",
                        text: "Data berhasil ditambahkan",
                        icon: "success"
                    }).then(() => {
                        window.location = "./index.html";
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: err.response?.data?.message || 'Terjadi kesalahan saat mengupload file.'
                });
            }
        };

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("role_id");
            window.location.href = "login.html";
        }

        function updateFileName() {
        const fileInput = document.getElementById("file");
        const fileLabel = fileInput.nextElementSibling;
        const fileName = fileInput.files[0] ? fileInput.files[0].name : "Choose file";
        
        fileLabel.innerText = fileName;
}
    </script>
</body>

</html>
